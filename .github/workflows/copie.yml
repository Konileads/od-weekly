name: copie
on:
  schedule:
    - cron: "10 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: copie
  cancel-in-progress: false
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fsS --retry 3 --retry-delay 20 -m 300 -A "Mozilla/5.0 (compatible; od-weekly)" \
            -o site/amo.zip \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/amo/tous_acteurs_mandats_organes_xi_legislature/AMO30_tous_acteurs_tous_mandats_tous_organes_historique.json.zip"
          unzip -tq site/amo.zip
          size=$(stat -c %s site/amo.zip)
          test "$size" -gt 5000000
          (cd site && sha256sum amo.zip > amo.zip.sha256)
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $(cut -d' ' -f1 site/amo.zip.sha256) $size" > site/derniere-copie.txt
          touch site/.nojekyll
      - name: Garder le depot actif (GitHub coupe les taches planifiees apres 60 jours sans activite)
        run: |
          cp site/derniere-copie.txt derniere-copie.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere-copie.txt
          git commit -m "copie du $(date -u +%Y-%m-%d)" || exit 0
          git push origin HEAD
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
